<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Sen Tolbi — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --terracotta: #C4501A;
      --terracotta-dark: #8B3210;
      --sand: #E8C98A;
      --sand-light: #F5E6C4;
      --baobab: #3D2B1A;
      --gold: #D4922A;
      --cream: #FBF4E6;
      --white: #FFFDF7;
      --text: #2A1A0E;
    }
    body { font-family: 'DM Sans', sans-serif; background: #F2EAD8; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: var(--white); border-radius: 12px; max-width: 440px; width: 100%; padding: 2.2rem 1.8rem; text-align: center; border: 1.5px solid rgba(196,80,26,.12); }
    .woven { height: 6px; margin: 1.2rem auto; width: 120px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--terracotta) 0 12px, var(--gold) 12px 24px, var(--sand) 24px 36px); }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--baobab); }
    p { font-size: .92rem; color: #6B4F35; line-height: 1.6; margin-top: .6rem; }
    .loading { font-size: .92rem; color: #8B6B50; }
    .btns { display: flex; flex-direction: column; gap: .7rem; margin-top: 1.6rem; }
    .btn { display: block; padding: .85rem 1rem; border-radius: 6px; font-family: inherit; font-size: .95rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
    .btn-primary { background: var(--terracotta); color: var(--white); }
    .btn-outline { background: transparent; color: var(--terracotta); border: 1.5px solid var(--terracotta); }
    #content { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="loading" id="loading">⏳ Vérification de l'accès…</div>
  <div id="content">
    <h1>Espace administrateur</h1>
    <div class="woven"></div>
    <p>Cet espace est en construction.</p>
    <div class="btns">
      <a href="index.html" class="btn btn-outline">🏠 Accueil</a>
      <button class="btn btn-primary" onclick="logout()">Se déconnecter</button>
    </div>
  </div>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient('https://hrhnawzhxwahqkhvxomr.supabase.co', 'sb_publishable_8MOWd0KD2jgcV1aN3VaPzA_RfBQLEHf');

  // Accès réservé aux comptes dont le type est « admin » dans la table utilisateurs.
  // Sinon : retour à la page de connexion.
  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ window.location.href='connexion.html'; return; }
    const { data: profil } = await sb.from('utilisateurs').select('type').eq('id', session.user.id).single();
    if(!profil || profil.type!=='admin'){ window.location.href='connexion.html'; return; }
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  }

  async function logout(){
    await sb.auth.signOut();
    localStorage.removeItem('sentolbi_user');
    window.location.href='index.html';
  }

  init();
</script>
</body>
</html>
