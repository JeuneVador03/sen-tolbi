<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sen Tolbi — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--terracotta:#C4501A;--terracotta-dark:#8B3210;--sand:#E8C98A;--baobab:#3D2B1A;--gold:#D4922A;--green:#2D6A4F;--cream:#FBF4E6;--white:#FFFDF7;--text:#2A1A0E;}
    body{background:var(--cream);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;background-image:radial-gradient(circle,rgba(196,80,26,.08) 1px,transparent 1px);background-size:28px 28px;}
    .woven{height:5px;background:repeating-linear-gradient(90deg,var(--terracotta) 0 12px,var(--gold) 12px 24px,var(--green) 24px 36px,var(--sand) 36px 48px);}
    .page{max-width:460px;margin:3rem auto;padding:0 1.5rem;animation:fadeUp .5s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .page-icon{text-align:center;font-size:3rem;margin-bottom:.8rem;}
    .page-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--baobab);text-align:center;margin-bottom:.3rem;}
    .page-sub{text-align:center;color:#6B4F35;font-size:.9rem;margin-bottom:1.8rem;}
    .type-selector{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.8rem;}
    .type-btn{padding:1.2rem 1rem;border-radius:10px;border:2px solid rgba(196,80,26,.2);background:var(--white);cursor:pointer;text-align:center;transition:all .2s;}
    .type-btn.active{border-color:var(--terracotta);background:rgba(196,80,26,.06);box-shadow:0 4px 16px rgba(196,80,26,.15);}
    .type-icon{font-size:2rem;display:block;margin-bottom:.4rem;}
    .type-label{font-weight:700;font-size:1rem;color:var(--baobab);display:block;}
    .type-btn.active .type-label{color:var(--terracotta);}
    .type-desc{font-size:.75rem;color:#8B6B50;}
    .card{background:var(--white);border-radius:12px;padding:2rem;border:1.5px solid rgba(196,80,26,.12);box-shadow:0 8px 32px rgba(61,43,26,.08);}
    .form-group{margin-bottom:1.1rem;}
    label{display:block;font-size:.75rem;font-weight:600;color:var(--baobab);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.5px;}
    input{width:100%;padding:.75rem .9rem;border:1.5px solid rgba(61,43,26,.15);border-radius:6px;background:var(--white);font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--text);transition:border-color .2s;}
    input:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(196,80,26,.08);}
    input::placeholder{color:#B09075;}
    .pwd-wrap{position:relative;}
    .pwd-toggle{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1rem;background:none;border:none;color:#8B6B50;}
    .forgot-link{text-align:right;margin-top:.3rem;}
    .forgot-link a{font-size:.78rem;color:var(--terracotta);text-decoration:none;}
    .alert{padding:.8rem 1rem;border-radius:6px;font-size:.82rem;margin-bottom:1rem;display:none;border-left:3px solid;}
    .alert.show{display:block;} .alert-error{background:rgba(214,59,59,.08);border-color:#D63B3B;color:#D63B3B;}
    .btn-primary{width:100%;padding:.95rem;background:var(--terracotta);color:var(--white);border:none;border-radius:6px;border-bottom:3px solid var(--terracotta-dark);font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;}
    .btn-primary:hover{background:var(--terracotta-dark);transform:translateY(1px);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:#8B6B50;font-size:.78rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(61,43,26,.1);}
    .security-note{display:flex;align-items:center;gap:.5rem;justify-content:center;margin-top:1.2rem;font-size:.75rem;color:#8B6B50;}
    @media(max-width:500px){.page{margin:1.5rem auto;}}
  </style>
</head>
<body>
<div class="woven"></div>
<div class="page">
  <div class="page-icon">🪣</div>
  <h1 class="page-title">Se connecter</h1>
  <p class="page-sub">Choisissez votre type de compte</p>
  <div class="type-selector">
    <div class="type-btn active" onclick="selectType('vendeur',this)"><span class="type-icon">👨‍🌾</span><span class="type-label">Vendeur</span><span class="type-desc">Je vends mes produits</span></div>
    <div class="type-btn" onclick="selectType('acheteur',this)"><span class="type-icon">🛒</span><span class="type-label">Acheteur</span><span class="type-desc">Je cherche des produits</span></div>
  </div>
  <div class="card">
    <div class="alert alert-error" id="alertError"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="votre@email.com"/>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <div class="pwd-wrap">
        <input type="password" id="password" placeholder="Votre mot de passe"/>
        <button class="pwd-toggle" onclick="togglePwd()" type="button">👁️</button>
      </div>
    </div>
    <button class="btn-primary" id="btnLogin" onclick="login()">Se connecter →</button>
    <div class="divider">ou</div>
    <div style="text-align:center;font-size:.85rem;color:#6B4F35;">
      Pas encore de compte ?<br>
      <a href="inscription.html" style="color:var(--terracotta);font-weight:600;text-decoration:none;">Créer un compte gratuitement →</a>
    </div>
  </div>
  <div class="security-note">🔒 Connexion sécurisée · Mot de passe chiffré</div>
</div>

<script>
  const { createClient } = supabase;
  window._sb = createClient('https://hrhnawzhxwahqkhvxomr.supabase.co', 'sb_publishable_8MOWd0KD2jgcV1aN3VaPzA_RfBQLEHf');

  const NAV_HTML = `
<style>
.nav-hamburger { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(251,244,230,0.97); backdrop-filter: blur(10px); border-bottom: 2px solid rgba(196,80,26,.15); padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; }
.nav-logo { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
.nav-logo-icon { width: 34px; height: 34px; background: #C4501A; border-radius: 50% 50% 50% 20%; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 2px 2px 0 #8B3210; }
.nav-logo-text { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: #C4501A; }
.nav-logo-text span { color: #D4922A; }
.hamburger-btn { background: none; border: none; cursor: pointer; padding: .5rem; display: flex; flex-direction: column; gap: 5px; }
.hamburger-btn span { display: block; width: 24px; height: 2px; background: #3D2B1A; border-radius: 2px; transition: all .3s; }
.hamburger-btn.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger-btn.open span:nth-child(2) { opacity: 0; }
.hamburger-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
.nav-drawer { position: fixed; top: 0; right: -320px; bottom: 0; width: 300px; background: #3D2B1A; z-index: 999; transition: right .3s ease; display: flex; flex-direction: column; overflow-y: auto; }
.nav-drawer.open { right: 0; box-shadow: -8px 0 32px rgba(0,0,0,.3); }
.nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 998; backdrop-filter: blur(2px); }
.nav-overlay.open { display: block; }
.drawer-header { padding: 1.4rem; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; }
.drawer-logo-text { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 900; color: #F5E6C4; }
.drawer-logo-text span { color: #E8C98A; }
.drawer-close { background: none; border: none; color: rgba(255,255,255,.5); font-size: 1.4rem; cursor: pointer; }
.drawer-user { padding: 1rem 1.4rem; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: .8rem; }
.drawer-avatar { width: 40px; height: 40px; border-radius: 50%; background: #C4501A; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; border: 2px solid rgba(255,255,255,.1); flex-shrink: 0; }
.drawer-name { font-size: .9rem; font-weight: 600; color: #F5E6C4; }
.drawer-role { font-size: .72rem; color: rgba(232,201,138,.4); margin-top: .1rem; }
.drawer-woven { height: 4px; background: repeating-linear-gradient(90deg, #C4501A 0 10px, #D4922A 10px 20px, #2D6A4F 20px 30px, #E8C98A 30px 40px); }
.drawer-section { padding: .6rem 1.4rem .2rem; font-size: .62rem; font-weight: 700; color: rgba(232,201,138,.25); text-transform: uppercase; letter-spacing: 1.5px; }
.drawer-item { display: flex; align-items: center; gap: .8rem; padding: .8rem 1.4rem; color: rgba(245,230,196,.6); font-size: .9rem; text-decoration: none; transition: all .2s; border-left: 3px solid transparent; }
.drawer-item:hover { color: #F5E6C4; background: rgba(255,255,255,.05); border-left-color: rgba(196,80,26,.4); }
.drawer-item.active { color: #E8C98A; background: rgba(196,80,26,.2); border-left-color: #C4501A; font-weight: 500; }
.drawer-item .di-icon { font-size: 1.1rem; width: 20px; text-align: center; }
.drawer-divider { height: 1px; background: rgba(255,255,255,.06); margin: .5rem 0; }
.drawer-btn-primary { margin: .5rem 1.4rem; padding: .8rem 1rem; background: #C4501A; color: white; border: none; border-bottom: 3px solid #8B3210; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: .9rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: block; transition: all .2s; }
.drawer-btn-primary:hover { background: #8B3210; }
.drawer-btn-outline { margin: .3rem 1.4rem; padding: .75rem 1rem; background: transparent; color: rgba(245,230,196,.7); border: 1.5px solid rgba(255,255,255,.15); border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: .9rem; cursor: pointer; text-align: center; text-decoration: none; display: block; transition: all .2s; }
.drawer-btn-outline:hover { border-color: rgba(255,255,255,.3); color: white; }
.drawer-logout { margin: auto 1.4rem 1.4rem; padding: .75rem 1rem; background: rgba(196,80,26,.15); border: 1px solid rgba(196,80,26,.3); border-radius: 6px; color: rgba(232,201,138,.7); font-family: 'DM Sans', sans-serif; font-size: .88rem; cursor: pointer; display: flex; align-items: center; gap: .5rem; justify-content: center; transition: all .2s; width: calc(100% - 2.8rem); }
.drawer-logout:hover { background: rgba(196,80,26,.3); color: #E8C98A; }
</style>

<nav class="nav-hamburger" id="mainNav">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">🪣</div>
    <div class="nav-logo-text">Sen <span>Tolbi</span></div>
  </a>
  <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleDrawer()">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="nav-overlay" id="navOverlay" onclick="closeDrawer()"></div>

<div class="nav-drawer" id="navDrawer">
  <div class="drawer-header">
    <div class="drawer-logo-text">Sen <span>Tolbi</span></div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-woven"></div>
  <div id="drawerUserSection"></div>
  <div id="drawerNav"></div>
</div>
`;

function initNav() {
  document.body.insertAdjacentHTML('afterbegin', NAV_HTML);
  // Add padding to body for fixed nav
  document.body.style.paddingTop = '62px';
  buildDrawer();
}

async function buildDrawer() {
  const { data: { session } } = await window._sb.auth.getSession();
  const user = JSON.parse(localStorage.getItem('sentolbi_user') || '{}');
  const isLoggedIn = session || user.prenom;
  const dashLink = user.type === 'acheteur' ? 'dashboard-acheteur.html' : 'dashboard-agriculteur.html';
  const name = user.prenom ? (user.prenom + ' ' + (user.nom || '')) : (session?.user?.email || '');
  const role = user.type === 'acheteur' ? 'Acheteur' : (user.type === 'vendeur' ? 'Vendeur' : '');

  const userSection = document.getElementById('drawerUserSection');
  const navSection = document.getElementById('drawerNav');

  if (isLoggedIn) {
    userSection.innerHTML = `
      <div class="drawer-user">
        <div class="drawer-avatar">${user.type === 'acheteur' ? '🛒' : '👨‍🌾'}</div>
        <div>
          <div class="drawer-name">${name}</div>
          <div class="drawer-role">${role} · Dakar</div>
        </div>
      </div>`;

    navSection.innerHTML = `
      <div class="drawer-section">Navigation</div>
      <a href="index.html" class="drawer-item"><span class="di-icon">🏠</span> Accueil</a>
      <a href="catalogue.html" class="drawer-item"><span class="di-icon">🛒</span> Catalogue produits</a>
      <a href="${dashLink}" class="drawer-item"><span class="di-icon">📊</span> Mon tableau de bord</a>
      <div class="drawer-divider"></div>
      <div class="drawer-section">Mon compte</div>
      <div class="drawer-divider"></div>
      <button class="drawer-logout" onclick="logoutNav()">🚪 Se déconnecter</button>`;
  } else {
    userSection.innerHTML = `
      <div style="padding:1.2rem 1.4rem; border-bottom:1px solid rgba(255,255,255,.08);">
        <div style="font-size:.85rem; color:rgba(232,201,138,.5); margin-bottom:.8rem;">Bienvenue sur Sen Tolbi 🇸🇳</div>
        <a href="inscription.html" class="drawer-btn-primary">Créer un compte</a>
        <a href="connexion.html" class="drawer-btn-outline">Se connecter</a>
      </div>`;

    navSection.innerHTML = `
      <div class="drawer-section">Navigation</div>
      <a href="index.html" class="drawer-item"><span class="di-icon">🏠</span> Accueil</a>
      <a href="catalogue.html" class="drawer-item"><span class="di-icon">🛒</span> Voir les produits</a>
      <a href="inscription.html" class="drawer-item"><span class="di-icon">📝</span> S'inscrire gratuitement</a>
      <a href="connexion.html" class="drawer-item"><span class="di-icon">🔑</span> Se connecter</a>`;
  }
}

function toggleDrawer() {
  const drawer = document.getElementById('navDrawer');
  const overlay = document.getElementById('navOverlay');
  const btn = document.getElementById('hamburgerBtn');
  drawer.classList.toggle('open');
  overlay.classList.toggle('open');
  btn.classList.toggle('open');
}

function closeDrawer() {
  document.getElementById('navDrawer').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
  document.getElementById('hamburgerBtn').classList.remove('open');
}

async function logoutNav() {
  await window._sb.auth.signOut();
  localStorage.removeItem('sentolbi_user');
  window.location.href = 'index.html';
}
  initNav();

  let userType = 'vendeur';
  function selectType(type,el){
    userType=type;
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
  }

  function togglePwd(){
    const input=document.getElementById('password');
    const btn=document.querySelector('.pwd-toggle');
    input.type=input.type==='password'?'text':'password';
    btn.textContent=input.type==='password'?'👁️':'🙈';
  }

  async function login(){
    const email=document.getElementById('email').value.trim();
    const pwd=document.getElementById('password').value;
    const alertEl=document.getElementById('alertError');
    const btn=document.getElementById('btnLogin');
    if(!email||!pwd){alertEl.textContent='❌ Veuillez remplir tous les champs.';alertEl.classList.add('show');return;}
    btn.disabled=true;btn.textContent='Connexion en cours...';
    alertEl.classList.remove('show');

    const {data,error}=await window._sb.auth.signInWithPassword({email,password:pwd});
    if(error){
      alertEl.textContent='❌ Email ou mot de passe incorrect.';
      alertEl.classList.add('show');
      btn.disabled=false;btn.textContent='Se connecter →';
      return;
    }

    const {data:profil}=await window._sb.from('utilisateurs').select('*').eq('id',data.user.id).single();

    if(profil){
      // Vérifier le type
      if(profil.type!==userType){
        alertEl.textContent='❌ Ce compte est un compte '+profil.type+'. Choisissez le bon type de compte.';
        alertEl.classList.add('show');
        await window._sb.auth.signOut();
        btn.disabled=false;btn.textContent='Se connecter →';
        return;
      }
      localStorage.setItem('sentolbi_user',JSON.stringify(profil));
      window.location.href=profil.type==='vendeur'?'dashboard-agriculteur.html':'dashboard-acheteur.html';
    } else {
      localStorage.setItem('sentolbi_user',JSON.stringify({id:data.user.id,email,type:userType}));
      window.location.href=userType==='vendeur'?'dashboard-agriculteur.html':'dashboard-acheteur.html';
    }
  }

</script>
</body>
</html>
