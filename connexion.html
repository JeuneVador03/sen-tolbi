<html lang="fr">
<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    .page-icon{text-align:center;font-size:3rem;margin-bottom:.8rem;}
    .page-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--baobab);text-align:center;margin-bottom:.3rem;}

    .type-btn.active{border-color:var(--terracotta);background:rgba(196,80,26,.06);box-shadow:0 4px 16px rgba(196,80,26,.15);}
    .type-icon{font-size:2rem;display:block;margin-bottom:.4rem;}
    .type-label{font-weight:700;font-size:1rem;color:var(--baobab);display:block;}
    .type-btn.active .type-label{color:var(--terracotta);}
    .type-desc{font-size:.75rem;color:#8B6B50;}
    .card{background:var(--white);border-radius:12px;padding:2rem;border:1.5px solid rgba(196,80,26,.12);box-shadow:0 8px 32px rgba(61,43,26,.08);}
    .form-group{margin-bottom:1.1rem;}
    label{display:block;font-size:.75rem;font-weight:600;color:var(--baobab);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.5px;}
    input{width:100%;padding:.75rem .9rem;border:1.5px solid rgba(61,43,26,.15);border-radius:6px;background:var(--white);font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--text);transition:border-color .2s;}
    input:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(196,80,26,.08);}
    input::placeholder{color:#B09075;}
    .pwd-wrap{position:relative;}
    .pwd-toggle{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1rem;background:none;border:none;color:#8B6B50;}
    .forgot-link{text-align:right;margin-top:.3rem;}
    .forgot-link a{font-size:.78rem;color:var(--terracotta);text-decoration:none;}
    .alert{padding:.8rem 1rem;border-radius:6px;font-size:.82rem;margin-bottom:1rem;display:none;border-left:3px solid;}

<nav class="nav-hamburger" id="mainNav">

<div class="nav-overlay" id="navOverlay" onclick="closeDrawer()"></div>

function initNav() {
  document.body.insertAdjacentHTML('afterbegin', NAV_HTML);
  // Add padding to body for fixed nav
  document.body.style.paddingTop = '62px';
  buildDrawer();
}


// ===== Outils communs (tâche 6) =====
// Protège l'affichage des textes saisis par les utilisateurs (prénom, nom…).
function echapper(t) {
  return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Page d'arrivée selon le type de compte.
function pageDeSonEspace(type) {
  if (type === 'acheteur') return 'dashboard-acheteur.html';
  if (type === 'admin') return 'admin.html';
  return 'dashboard-agriculteur.html';
}

// Lit le profil dans « utilisateurs » (les règles ne laissent lire que le sien).
// S'il est introuvable, on se rabat sur le type donné à l'inscription.
async function lireProfil(authUser) {
  try {
    const { data, error } = await window._sb.from('utilisateurs').select('*').eq('id', authUser.id).maybeSingle();
    if (!error && data) {
      localStorage.setItem('sentolbi_user', JSON.stringify(data));
      return data;
    }
  } catch (e) { /* réseau : on se rabat ci-dessous */ }
  const meta = authUser.user_metadata || {};
  const type = ['vendeur', 'acheteur'].includes(meta.type) ? meta.type : null;
  return { id: authUser.id, email: authUser.email, prenom: meta.prenom || '', nom: meta.nom || '', type, sansProfil: true };
}

// La barre du haut ne se fie plus seulement au navigateur : il faut une vraie session.
async function buildDrawer() {
  let session = null;
  try { ({ data: { session } } = await window._sb.auth.getSession()); } catch (e) {}
  if (!session) localStorage.removeItem('sentolbi_user');
  let user = session ? JSON.parse(localStorage.getItem('sentolbi_user') || '{}') : {};
  if (session && !user.type) user = await lireProfil(session.user);
  const isLoggedIn = !!session;
  const dashLink = pageDeSonEspace(user.type);
  const name = user.prenom ? (user.prenom + ' ' + (user.nom || '')) : (session?.user?.email || '');
  const role = user.type === 'acheteur' ? 'Acheteur' : (user.type === 'vendeur' ? 'Vendeur' : (user.type === 'admin' ? 'Admin' : ''));
  const roleLigne = [role, user.zone].filter(Boolean).join(' · ');

  const userSection = document.getElementById('drawerUserSection');
  const navSection = document.getElementById('drawerNav');

  if (isLoggedIn) {
    userSection.innerHTML = `
      <div class="drawer-user">
        <div class="drawer-avatar">${user.type === 'acheteur' ? '🛒' : '👨‍🌾'}</div>
        <div>
          <div class="drawer-name">${echapper(name)}</div>
          <div class="drawer-role">${echapper(roleLigne)}</div>
        </div>
      </div>`;

    navSection.innerHTML = `
      <div class="drawer-section">Navigation</div>
      <a href="index.html" class="drawer-item"><span class="di-icon">🏠</span> Accueil</a>
      <a href="catalogue.html" class="drawer-item"><span class="di-icon">🛒</span> Catalogue produits</a>
      <a href="${dashLink}" class="drawer-item"><span class="di-icon">📊</span> Mon tableau de bord</a>
      <div class="drawer-divider"></div>
      <button class="drawer-logout" onclick="logoutNav()">🚪 Se déconnecter</button>`;
  } else {
    userSection.innerHTML = `
      <div style="padding:1.2rem 1.4rem; border-bottom:1px solid rgba(255,255,255,.08);">
        <div style="font-size:.85rem; color:rgba(232,201,138,.5); margin-bottom:.8rem;">Bienvenue sur Sen Tolbi 🇸🇳</div>
        <a href="inscription.html" class="drawer-btn-primary">Créer un compte</a>
        <a href="connexion.html" class="drawer-btn-outline">Se connecter</a>
      </div>`;

    navSection.innerHTML = `
      <div class="drawer-section">Navigation</div>
      <a href="index.html" class="drawer-item"><span class="di-icon">🏠</span> Accueil</a>
      <a href="catalogue.html" class="drawer-item"><span class="di-icon">🛒</span> Voir les produits</a>
      <a href="inscription.html" class="drawer-item"><span class="di-icon">📝</span> S'inscrire gratuitement</a>
      <a href="connexion.html" class="drawer-item"><span class="di-icon">🔑</span> Se connecter</a>`;
  }
}

async function logoutNav() {
  await window._sb.auth.signOut();
  localStorage.removeItem('sentolbi_user');
  window.location.href = 'index.html';
}

// ===== Messages d'erreur en français (tâche 6) =====
// Supabase répond en anglais : on traduit les cas courants, et un message
// général pour les autres. Le texte anglais n'est jamais montré.
function traduireErreur(err) {
  if (!err) return 'Une erreur est survenue. Réessayez dans un instant.';
  const code = String(err.code || '');
  const msg = String(err.message || err).toLowerCase();
  if (code === 'invalid_credentials' || msg.includes('invalid login credentials'))
    return 'E-mail ou mot de passe incorrect.';
  if (code === 'email_not_confirmed' || msg.includes('email not confirmed'))
    return "Votre adresse e-mail n'est pas encore confirmée.";
  if (code === 'user_already_exists' || code === 'email_exists' || msg.includes('already registered') || msg.includes('already been registered'))
    return 'Cette adresse e-mail est déjà utilisée. Connectez-vous ou choisissez une autre adresse.';
  if (code === 'weak_password' || msg.includes('password should'))
    return 'Mot de passe trop court ou trop simple (au moins 6 caractères).';
  if (code === 'email_address_invalid' || msg.includes('unable to validate email') || (msg.includes('email') && msg.includes('invalid')))
    return 'Adresse e-mail invalide.';
  if (code.startsWith('over_') || err.status === 429 || msg.includes('rate limit') || msg.includes('too many'))
    return "Trop d'essais en peu de temps. Patientez quelques minutes puis réessayez.";
  if (err.name === 'AuthRetryableFetchError' || err.status === 0 || msg.includes('load failed') || msg.includes('failed to fetch') || msg.includes('network'))
    return 'Problème de connexion internet. Vérifiez votre réseau et réessayez.';
  if (msg.includes('row-level security'))
    return "Cette action n'est pas autorisée pour ce compte.";
  return 'Une erreur est survenue. Réessayez dans un instant.';
}

function afficherAlerte(texte) {
  const el = document.getElementById('alertError');
  el.textContent = '❌ ' + texte;
  el.classList.add('show');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function cacherAlerte() {
  const el = document.getElementById('alertError');
  el.textContent = '';
  el.classList.remove('show');
}

// Format d'e-mail simple : quelque@chose.xx
function emailValide(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }

// Si une vraie session existe déjà, on part vers son espace.
// getUser() vérifie la session auprès de Supabase (évite les boucles avec une session expirée).
async function redirigerSiDejaConnecte() {
  try {
    const { data: { user }, error } = await window._sb.auth.getUser();
    if (error || !user) return;
    const profil = await lireProfil(user);
    if (profil.type) window.location.replace(pageDeSonEspace(profil.type));
  } catch (e) { /* pas de réseau : on reste sur la page */ }
}

  initNav();

  let userType = 'vendeur';
  function selectType(type,el){
    userType=type;
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
  }

  function togglePwd(){
    const input=document.getElementById('password');
    const btn=document.querySelector('.pwd-toggle');
    input.type=input.type==='password'?'text':'password';
    btn.textContent=input.type==='password'?'👁️':'🙈';
  }

  function erreurChamp(id, texte) {
    const input = document.getElementById(id);
    const msg = document.getElementById('err-' + id);
    input.classList.toggle('error', !!texte);
    msg.textContent = texte || '';
    msg.classList.toggle('show', !!texte);
  }

  // Le choix Vendeur / Acheteur n'est plus bloquant : c'est le type enregistré
  // dans le compte qui décide de la page d'arrivée.
  async function login(){
    const email=document.getElementById('email').value.trim();
    const pwd=document.getElementById('password').value;
    const btn=document.getElementById('btnLogin');
    if (btn.disabled) return;                       // pas de double envoi
    cacherAlerte();
    erreurChamp('email', !email ? 'E-mail obligatoire.' : (!emailValide(email) ? 'Adresse e-mail invalide (exemple : nom@gmail.com).' : ''));
    erreurChamp('password', !pwd ? 'Mot de passe obligatoire.' : '');
    if (!email || !emailValide(email) || !pwd) return;

    btn.disabled=true; btn.textContent='Connexion en cours…';
    const remettreBouton=()=>{btn.disabled=false;btn.textContent='Se connecter →';};

    let res;
    try { res = await window._sb.auth.signInWithPassword({email,password:pwd}); }
    catch (e) { res = { error: e }; }
    if (res.error) { afficherAlerte(traduireErreur(res.error)); remettreBouton(); return; }

    const profil = await lireProfil(res.data.user);
    if (!profil.type) {
      afficherAlerte("Votre compte n'a pas de profil complet. Prévenez l'équipe Sen Tolbi.");
      await window._sb.auth.signOut();
      localStorage.removeItem('sentolbi_user');
      remettreBouton();
      return;
    }
    if (profil.sansProfil) localStorage.setItem('sentolbi_user', JSON.stringify(profil));
    window.location.href = pageDeSonEspace(profil.type);
  }

  // Touche Entrée = se connecter
  ['email','password'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); }));

  redirigerSiDejaConnecte();

</script>
